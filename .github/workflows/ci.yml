name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Audit, test, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/dev.db
      ENCRYPTION_KEY: ci-only-encryption-key-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=low

      - name: Generate Prisma client and test database
        run: |
          npx prisma generate
          npx prisma db push

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
