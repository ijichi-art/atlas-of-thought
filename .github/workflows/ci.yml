name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Audit, test, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/dev.db
      ENCRYPTION_KEY: ci-only-encryption-key-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=low

      - name: Generate Prisma client and test database
        run: |
          npx prisma generate
          npx prisma db push

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
