name: Release Electron build

# Triggered when a tag like v1.0.0 is pushed. Builds Mac (Intel +
# Apple Silicon dmg), Windows (NSIS installer), and Linux (AppImage +
# .deb). All builds are unsigned — see electron-builder.yml.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    # Ensure every step (prisma db push + next build's prerender) uses
    # the same SQLite path so the tables created in setup are visible
    # during the build's prerender pass.
    env:
      DATABASE_URL: file:./prisma/dev.db

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client + create empty SQLite schema
        # `prisma db push` creates the SQLite file with all tables. Next.js
        # touches Prisma while prerendering /login, so the schema must exist
        # at build time. The actual user database lives in Electron's app-data
        # directory.
        run: |
          npx prisma generate
          npx prisma db push

      - name: Build (Mac)
        if: matrix.os == 'macos-latest'
        run: npm run electron:build:mac

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build:linux

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-${{ matrix.os }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: warn

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Atlas of Thought ${{ github.ref_name }}

            Local-first desktop app — drop your AI chat history, get a
            Google-Maps-style atlas of your thinking.

            **Downloads** are unsigned. First launch:
            - **macOS**: right-click the app → *Open* → *Open* (one time)
            - **Windows**: when SmartScreen warns, click *More info* → *Run anyway*
            - **Linux**: `chmod +x atlas-of-thought-*.AppImage` if needed

            See the [README](https://github.com/ijichi-art/atlas-of-thought#quick-start)
            for first-run setup (paste your LLM API key, import a chat
            export, click *Terraform*).
